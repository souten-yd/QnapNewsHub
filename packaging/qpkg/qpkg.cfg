# QnapNewsHub の QPKG の設定（QDK 2.5.3）。QPKG_VER は build.sh が backend の __version__ から書き換える。
QPKG_NAME="QnapNewsHub"
QPKG_DISPLAY_NAME="QnapNewsHub"
QPKG_VER="0.1.0"
QPKG_AUTHOR="QnapNewsHub"
QPKG_LICENSE="See repository"
QPKG_SUMMARY="ニュースを集める・ためる・読む・知識にするサーバー（ニュースハブ）"
QPKG_RC_NUM="190"
QPKG_SERVICE_PROGRAM="QnapNewsHub.sh"
QPKG_SERVICE_PIDFILE="/var/run/qnapnewshub.pid"
QPKG_WEBUI="/"
QPKG_WEB_PORT="8787"
QPKG_SERVICE_PORT="8787"
QTS_MINI_VERSION="4.5.0"
# 停止は、メモリに溜めた記事を書き切るまで待つ（Write Coordinator）。開始 60 秒・停止 120 秒
QPKG_TIMEOUT="60,120"
QPKG_VISIBLE="1"
QPKG_DIR_ICONS="icons"
QDK_DATA_DIR_X86_64="x86_64"

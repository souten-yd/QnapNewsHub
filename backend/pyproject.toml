[project]
name = "qnapnewshub"
version = "0.1.0"
description = "QNAP ニュースハブ: ニュースを集める・ためる・読む（ControlDeck のニュースの核）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.52",
    "cryptography==50.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
qnapnewshub = "qnapnewshub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qnapnewshub*"]

[tool.setuptools.package-data]
qnapnewshub = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "qnapnewshub"
version = "0.1.1"
description = "QNAP ニュースハブ: ニュースを集める・ためる・読む（ControlDeck のニュースの核）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.52",
    "cryptography==50.0.0",
    "trafilatura==2.4.0",
    "zstandard==0.25.0",
    # trafilatura の依存（QPKG の manylinux2014 の wheel があるもの。requirements.lock と同じ版）
    "lxml==6.1.3",
    "courlan==1.5.0",
    "htmldate==1.11.0",
    "dateparser==1.5.1",
    "charset-normalizer==3.5.3",
    "python-dateutil==4.0.0",
    "pytz==2026.6",
    "regex==2026.11.23",
    "tzlocal==5.4.5",
    "tzdata==2026.6",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
qnapnewshub = "qnapnewshub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qnapnewshub*"]

[tool.setuptools.package-data]
qnapnewshub = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Python 3.12 の sqlite3 の「datetime の既定の変換」は非推奨。datetime を束縛に直接渡す書き方が混ざったら試験が落ちる（v0.6 で 111 件を 0 にした）
filterwarnings = ["error:The default datetime adapter:DeprecationWarning"]
